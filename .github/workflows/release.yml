name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release-info:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
      npm_exists: ${{ steps.info.outputs.npm_exists }}
      release_exists: ${{ steps.info.outputs.release_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check release state
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE="$(bun -e 'const pkg=await Bun.file("package.json").json(); console.log(pkg.name)')"
          VERSION="$(bun -e 'const pkg=await Bun.file("package.json").json(); console.log(pkg.version)')"
          TAURI_VERSION="$(bun -e 'const cfg=await Bun.file("src-tauri/tauri.conf.json").json(); console.log(cfg.version)')"
          if [ "$VERSION" != "$TAURI_VERSION" ]; then
            echo "::error::package.json version $VERSION does not match src-tauri/tauri.conf.json version $TAURI_VERSION"
            exit 1
          fi
          TAG="v$VERSION"
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            NPM_EXISTS=true
          else
            NPM_EXISTS=false
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          else
            RELEASE_EXISTS=false
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "npm_exists=$NPM_EXISTS"
            echo "release_exists=$RELEASE_EXISTS"
          } >> "$GITHUB_OUTPUT"

  build-tauri:
    runs-on: ubuntu-latest
    needs: release-info
    if: needs.release-info.outputs.release_exists == 'false'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No appindicator package: the app has no tray icon (tauri "tray-icon"
      # feature is off, so nothing links libappindicator), and the ayatana and
      # non-ayatana appindicator packages conflict with each other on apt.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The bundle targets are deb+rpm only: AppImage is not buildable for
      # this app because linuxdeploy patchelf-corrupts the bun-compiled
      # binaries it ships (bun sidecar, claude SDK CLI).
      - name: Build Tauri app and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.release-info.outputs.tag }}
          releaseName: "Vault Assistant ${{ needs.release-info.outputs.tag }}"
          releaseDraft: false
          prerelease: false

  publish-npm:
    runs-on: ubuntu-latest
    needs: release-info
    if: needs.release-info.outputs.npm_exists == 'false'
    # NPM_TOKEN is an environment secret; it is only injected into jobs that
    # declare this environment.
    environment: npm-release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish to npm
        run: |
          printf "//registry.npmjs.org/:_authToken=%s\n" "$NODE_AUTH_TOKEN" > ~/.npmrc
          bun publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
