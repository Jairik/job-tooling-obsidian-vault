# Temporary diagnostic workflow: reproduces the release build-tauri job with
# verbose output so linuxdeploy's stderr (swallowed by the release build) is
# visible. Delete once the AppImage bundling failure is fixed.
name: Debug AppImage bundling

on:
  push:
    branches: [workflow-fix]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  debug-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tool versions
        run: |
          strip --version | head -1
          patchelf --version

      - name: Build with verbose bundler output
        run: |
          if bunx tauri build --verbose; then
            echo "BUILD OK without NO_STRIP"
          else
            echo "::warning::verbose build failed, retrying with NO_STRIP=true"
            NO_STRIP=true bunx tauri build --verbose
            echo "BUILD OK with NO_STRIP=true"
          fi

      # The bundling failure is `ldd` exiting 1 on the bun sidecar inside the
      # AppDir; compare it against the pristine binary to see whether
      # linuxdeploy's patchelf/strip pass corrupted it.
      - name: Autopsy bun sidecar in AppDir
        if: failure()
        run: |
          APPDIR="src-tauri/target/release/bundle/appimage/Vault Assistant.AppDir"
          ls -la "$APPDIR/usr/bin/" || true
          echo "=== AppDir bun ==="
          file "$APPDIR/usr/bin/bun" || true
          ldd "$APPDIR/usr/bin/bun" || echo "ldd on AppDir bun exited: $?"
          readelf -d "$APPDIR/usr/bin/bun" | head -25 || true
          echo "=== pristine bun ==="
          file src-tauri/binaries/bun-x86_64-unknown-linux-gnu
          ldd src-tauri/binaries/bun-x86_64-unknown-linux-gnu || echo "ldd on pristine bun exited: $?"
          echo "=== checksums ==="
          md5sum "$APPDIR/usr/bin/bun" src-tauri/binaries/bun-x86_64-unknown-linux-gnu || true
          echo "=== does AppDir bun still run? ==="
          "$APPDIR/usr/bin/bun" --version || echo "AppDir bun exited: $?"
