# Temporary diagnostic workflow: reproduces the release build-tauri job.
# AppImage bundling is unfixable for this app (linuxdeploy rpath-patches every
# ELF it finds, and patchelf — bundled or system — corrupts the bun-compiled
# claude SDK binary shipped in resources). Validate deb+rpm as the release
# bundle formats instead. Delete once release.yml is settled.
name: Debug AppImage bundling

on:
  push:
    branches: [workflow-fix]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  debug-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build deb and rpm bundles
        run: bunx tauri build --verbose --bundles deb,rpm

      - name: Verify packaged binaries are intact
        run: |
          ls -la src-tauri/target/release/bundle/deb/ src-tauri/target/release/bundle/rpm/
          DEB="$(ls src-tauri/target/release/bundle/deb/*.deb)"
          EXTRACT=/tmp/deb-extract
          dpkg-deb -x "$DEB" "$EXTRACT"
          find "$EXTRACT" -type f -name bun -o -type f -name claude | head
          "$EXTRACT/usr/bin/bun" --version
          "$EXTRACT/usr/lib/Vault Assistant/app/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude" --version || \
            find "$EXTRACT" -name claude -type f -exec {} --version \;
