# Temporary diagnostic workflow: reproduces the release build-tauri job with
# verbose output so linuxdeploy's stderr (swallowed by the release build) is
# visible. Delete once the AppImage bundling failure is fixed.
name: Debug AppImage bundling

on:
  push:
    branches: [workflow-fix]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  debug-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # linuxdeploy's bundled patchelf corrupts the bun sidecar (rpath patch
      # -> ldd exit 1, segfault) while the system patchelf 0.18+ handles it
      # fine. PATCHELF and NO_STRIP are linuxdeploy's documented overrides for
      # its bundled patchelf/strip; stripping bun saves nothing anyway.
      - name: Build with system patchelf, no strip
        env:
          PATCHELF: /usr/bin/patchelf
          NO_STRIP: "true"
        run: bunx tauri build --verbose

      - name: Verify bundled bun sidecar is intact
        run: |
          APPDIR="src-tauri/target/release/bundle/appimage/Vault Assistant.AppDir"
          ldd "$APPDIR/usr/bin/bun"
          "$APPDIR/usr/bin/bun" --version
          ls -la src-tauri/target/release/bundle/appimage/

      - name: Autopsy bun sidecar in AppDir
        if: failure()
        run: |
          APPDIR="src-tauri/target/release/bundle/appimage/Vault Assistant.AppDir"
          ls -la "$APPDIR/usr/bin/" || true
          file "$APPDIR/usr/bin/bun" || true
          ldd "$APPDIR/usr/bin/bun" || echo "ldd on AppDir bun exited: $?"
          md5sum "$APPDIR/usr/bin/bun" src-tauri/binaries/bun-x86_64-unknown-linux-gnu || true
          "$APPDIR/usr/bin/bun" --version || echo "AppDir bun exited: $?"
