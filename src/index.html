<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vault Assistant</title>
    <link rel="icon" type="image/png" href="./assets/vault-assistant-logo-v2.png" />
    <!-- Apply saved theme/density before paint to avoid a flash. -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          d.dataset.theme = localStorage.getItem("jt.theme") || "dark";
          d.dataset.density = localStorage.getItem("jt.density") || "comfortable";
          if (localStorage.getItem("jt.fun") === "on") d.dataset.fun = "on";
        } catch (e) {
          d.dataset.theme = "dark";
          d.dataset.density = "comfortable";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
