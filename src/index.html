<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Tooling</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3.4' y='3.4' width='9.2' height='9.2' rx='2' transform='rotate(45 8 8)' fill='%234b7bec'/%3E%3Ctext x='8' y='10.2' font-size='5.5' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EJT%3C/text%3E%3C/svg%3E"
    />
    <!-- Apply saved theme/density before paint to avoid a flash. -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          d.dataset.theme = localStorage.getItem("jt.theme") || "dark";
          d.dataset.density = localStorage.getItem("jt.density") || "comfortable";
          if (localStorage.getItem("jt.fun") === "on") d.dataset.fun = "on";
        } catch (e) {
          d.dataset.theme = "dark";
          d.dataset.density = "comfortable";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
